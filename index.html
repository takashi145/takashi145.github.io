<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="./style.css">
    <script>
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (!saved && prefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <button id="theme-toggle"></button>
    <button id="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
    <div id="content"></div>
    <script type="module">
      import { loadMarkdown } from "https://hacknock.github.io/lobsterjs/lobster.js";
      Promise.resolve(loadMarkdown("./content.md", document.getElementById("content")))
        .then(initNavHighlight);

      function initNavHighlight() {
        const items = [...document.querySelectorAll(".lbs-header a[href^='#']")]
          .map((a) => ({ a, el: document.getElementById(a.getAttribute("href").slice(1)) }))
          .filter((item) => item.el);
        if (items.length === 0) return;

        // ヘッダーの実測の高さで補正する（画面幅によって高さが変わるため）
        const header = document.querySelector(".lbs-header");
        const offset = () => (header ? header.getBoundingClientRect().height + 8 : 70);
        let current = null;
        let ticking = false;

        const sync = () => {
          ticking = false;
          let active = items[0];
          const limit = offset();
          for (const item of items) {
            if (item.el.getBoundingClientRect().top <= limit) active = item;
          }
          if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
            active = items[items.length - 1];
          }
          if (active === current) return;
          current = active;
          items.forEach((item) => item.a.classList.toggle("is-current", item === active));
        };

        const onScroll = () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(sync);
        };

        addEventListener("scroll", onScroll, { passive: true });
        addEventListener("resize", onScroll);
        sync();
      }

      const btn = document.getElementById("theme-toggle");
      const root = document.documentElement;
      const update = () => {
        btn.textContent = root.hasAttribute("data-theme") ? "Light" : "Dark";
      };
      btn.addEventListener("click", () => {
        const isDark = root.hasAttribute("data-theme");
        if (isDark) {
          root.removeAttribute("data-theme");
        } else {
          root.setAttribute("data-theme", "dark");
        }
        localStorage.setItem("theme", isDark ? "light" : "dark");
        update();
      });
      update();
    </script>
  </body>
</html>
