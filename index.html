<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="./style.css">
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
  </head>
  <body>
    <button id="theme-toggle"></button>
    <div id="content"></div>
    <script type="module">
      import { loadMarkdown } from "https://hacknock.github.io/lobsterjs/lobster.js";
      Promise.resolve(loadMarkdown("./content.md", document.getElementById("content")))
        .then(() => {
          moveThemeToggleIntoHeader();
          initNavHighlight();
        });

      function moveThemeToggleIntoHeader() {
        const header = document.querySelector(".lbs-header");
        const toggle = document.getElementById("theme-toggle");
        if (!header || !toggle) return;
        header.appendChild(toggle);
        toggle.classList.add("in-header");
      }

      function initNavHighlight() {
        const items = [...document.querySelectorAll(".lbs-header a[href^='#']")]
          .map((a) => ({ a, el: document.getElementById(a.getAttribute("href").slice(1)) }))
          .filter((item) => item.el);
        if (items.length === 0) return;

        // ヘッダーの実測の高さで補正する（画面幅によって高さが変わるため）
        const header = document.querySelector(".lbs-header");
        const offset = () => (header ? header.getBoundingClientRect().height + 8 : 70);
        let current = null;
        let ticking = false;

        const sync = () => {
          ticking = false;
          let active = items[0];
          const limit = offset();
          for (const item of items) {
            if (item.el.getBoundingClientRect().top <= limit) active = item;
          }
          if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
            active = items[items.length - 1];
          }
          if (active === current) return;
          current = active;
          items.forEach((item) => item.a.classList.toggle("is-current", item === active));
        };

        const onScroll = () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(sync);
        };

        addEventListener("scroll", onScroll, { passive: true });
        addEventListener("resize", onScroll);
        sync();
      }

      const btn = document.getElementById("theme-toggle");
      const root = document.documentElement;
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const MODES = ["light", "dark", "system"];
      const LABELS = { light: "Light", dark: "Dark", system: "System" };

      const currentMode = () => {
        const saved = localStorage.getItem("theme");
        return saved === "light" || saved === "dark" ? saved : "system";
      };

      const applyTheme = () => {
        const mode = currentMode();
        const dark = mode === "dark" || (mode === "system" && media.matches);
        if (dark) {
          root.setAttribute("data-theme", "dark");
        } else {
          root.removeAttribute("data-theme");
        }
        btn.textContent = LABELS[mode];
        btn.title = "表示テーマ: " + LABELS[mode] + "（クリックで切り替え）";
      };

      btn.addEventListener("click", () => {
        const next = MODES[(MODES.indexOf(currentMode()) + 1) % MODES.length];
        if (next === "system") {
          localStorage.removeItem("theme");
        } else {
          localStorage.setItem("theme", next);
        }
        applyTheme();
      });

      media.addEventListener("change", () => {
        if (currentMode() === "system") applyTheme();
      });

      applyTheme();
    </script>
  </body>
</html>
